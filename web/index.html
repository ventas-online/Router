<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Router — resilient multi-provider AI workspace">
  <title>Router AI</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">R</div><div><strong>Router</strong><span>AI Workspace</span></div></div>
      <button class="new-chat" id="newChat">＋ New chat</button>
      <div class="history-label">RECENT</div>
      <div class="history" id="history"></div>
      <div class="sidebar-bottom">
        <div class="status-pill" id="statusPill"><i></i><span>Connecting…</span></div>
        <button class="side-action" id="settingsBtn">⚙ Settings</button>
        <a class="side-action" href="https://github.com/ventas-online/Router" target="_blank" rel="noreferrer">↗ GitHub</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open menu">☰</button>
        <div class="model-wrap">
          <button class="model-btn" id="modelBtn"><span id="modelName">Auto Router</span><small>⌄</small></button>
          <div class="model-menu" id="modelMenu"></div>
        </div>
        <div class="top-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button><button class="icon-btn" id="clearBtn" title="Clear conversation">⌫</button></div>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="welcome-orb">R</div>
          <h1>How can I help?</h1>
          <p>One intelligent interface. Multiple AI providers. Automatic failover.</p>
          <div class="suggestions">
            <button data-prompt="Explain how an LLM router works in simple terms">Explain an LLM router</button>
            <button data-prompt="Design a production architecture for an AI SaaS">Design an AI SaaS architecture</button>
            <button data-prompt="Write a Python function with tests">Write Python + tests</button>
            <button data-prompt="Analyze the advantages of automatic model failover">Analyze model failover</button>
          </div>
        </div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message Router…" autocomplete="off"></textarea>
          <div class="composer-bar"><div class="composer-tools"><button type="button" class="tool-btn" title="Attach">＋</button><span id="providerHint">Auto routing</span></div><button class="send-btn" id="sendBtn" type="submit" aria-label="Send">↑</button></div>
        </form>
        <div class="disclaimer">Router can make mistakes. Check important information. <span id="latency"></span></div>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="settingsModal"><div class="modal"><button class="modal-close" id="closeSettings">×</button><h2>Router settings</h2><p>Runtime information and routing controls.</p><div id="settingsContent"></div></div></div>
  <script src="/app.js"></script>
</body>
</html>
